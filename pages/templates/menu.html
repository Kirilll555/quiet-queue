<header class="site-header">
    <nav class="main-nav">
        <div class="nav-brand">
            <a href="{% url 'index' %}" class="logo-link">Тихая очередь</a>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="{% url 'index' %}" class="nav-link">Главная</a></li>
            <li class="nav-item"><a href="{% url 'suggest' %}" class="nav-link">Предложить</a></li>
            <li class="nav-item"><a href="{% url 'rate' %}" class="nav-link">Оценить</a></li>
            <li class="nav-item"><a href="{% url 'ai_prediction' %}" class="nav-link">Прогноз загруженности</a></li>
            {% if user.is_authenticated %}
                <li class="nav-item">
                    <span class="nav-username">{{ user.username }}</span>
                </li>
                <li class="nav-item">
                    <form method="post" action="{% url 'logout' %}" class="logout-form">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-login">Выйти</button>
                    </form>
                </li>
            {% else %}
                <li class="nav-item">
                    <a href="{% url 'login' %}" class="btn btn-login">Войти</a>
                </li>
            {% endif %}
        </ul>
    </nav>
</header>

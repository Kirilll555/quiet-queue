name: CI/CD

on:
  push:
    branches:
      - main
      - development
      - devops
      - devops-ci-cd
      - "devops/**"
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migration files
        run: python manage.py makemigrations --check --dry-run

      - name: Check deployment scripts
        run: |
          bash -n deploy/deploy.sh
          python -m unittest discover -s deploy -p 'test_*.py' -v

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: python manage.py test --verbosity 2

      - name: Check production settings
        env:
          DJANGO_DEBUG: "false"
          DJANGO_HTTPS: "true"
          DJANGO_ALLOWED_HOSTS: localhost
          DJANGO_SECRET_KEY: ci-only-54e79b136ca02d86f9150f444b0e4a6754b7aa0ac21c824e
        run: python manage.py check --deploy --fail-level WARNING

  docker:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-54e79b136ca02d86f9150f444b0e4a6754b7aa0ac21c824e
    steps:
      - uses: actions/checkout@v6
      - name: Validate production Compose files
        env:
          APP_IMAGE: quiet-queue:validation
        run: docker compose -f compose.yaml -f compose.production.yaml -f compose.release.yaml config --quiet
      - name: Validate Caddy configuration
        run: docker run --rm -e SITE_DOMAIN=lev.art184.fvds.ru -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build and start application
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Check application and styling
        run: |
          curl --fail http://127.0.0.1:8000/healthz/
          curl --fail http://127.0.0.1:8000/
          curl --fail http://127.0.0.1:8000/static/css/base_styles.css -o /tmp/base_styles.css
          test -s /tmp/base_styles.css
      - name: Check database survives container recreation
        run: |
          docker compose exec -T web python manage.py shell -c "from pages.models import Institution; Institution.objects.create(name='CI persistence probe', category='mfc')"
          docker compose down
          docker compose up -d --wait --wait-timeout 120
          docker compose exec -T web python manage.py shell -c "from pages.models import Institution; assert Institution.objects.filter(name='CI persistence probe').exists()"
      - name: Package the tested image
        if: github.ref == 'refs/heads/devops-ci-cd' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p artifact
          docker tag "$(docker compose images -q web)" "quiet-queue:$GITHUB_SHA"
          docker save "quiet-queue:$GITHUB_SHA" | gzip > artifact/image.tar.gz
          tar --exclude=__pycache__ -czf artifact/deploy.tar.gz compose.yaml compose.production.yaml compose.release.yaml Caddyfile deploy
          (cd artifact && sha256sum image.tar.gz deploy.tar.gz > SHA256SUMS)
      - name: Store release artifact
        if: github.ref == 'refs/heads/devops-ci-cd' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: artifact/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up runner
        if: always()
        run: docker compose down --volumes

  deploy:
    needs: docker
    if: github.ref == 'refs/heads/devops-ci-cd' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: quiet-queue-production
      cancel-in-progress: false
    steps:
      - name: Skip outdated commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/devops-ci-cd" --jq .object.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit exists; skipping this deployment.'
          fi
      - name: Download tested release
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.sha }}
          path: artifact
      - name: Install SSH credentials
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy_known_hosts"
      - name: Upload and deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          options=(-i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts"
            -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          release="/opt/quiet-queue/releases/$GITHUB_SHA"
          (cd artifact && sha256sum -c SHA256SUMS)
          ssh "${options[@]}" "$target" "mkdir -p '$release'"
          scp "${options[@]}" artifact/image.tar.gz artifact/deploy.tar.gz artifact/SHA256SUMS "$target:$release/"
          ssh "${options[@]}" "$target" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          sha=$1
          cd "/opt/quiet-queue/releases/$sha"
          sha256sum -c SHA256SUMS
          tar -xzf deploy.tar.gz
          gzip -dc image.tar.gz | docker load
          bash deploy/deploy.sh "$sha"
          rm -f image.tar.gz deploy.tar.gz SHA256SUMS
          REMOTE
      - name: Remove SSH credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"

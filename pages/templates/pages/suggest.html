{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/suggest_styles.css' %}">
{% endblock %}

{% block title %}Предложить учреждение{% endblock %}

{% block content %}
    <section class="form-section">
        <h1 class="section-title">Предложить учреждение</h1>
        <p class="form-description">Заполните форму, и мы добавим его на сайт после проверки модератором.</p>
        <form method="post" class="suggest-form">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label" for="name">Название учреждения:</label>
                <input type="text" id="name" name="name" class="form-input" placeholder="Например: Поликлиника №5" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="category">Тип учреждения:</label>
                <select id="category" name="category" class="form-select" required>
                    <option value="" disabled selected>Выберите тип</option>
                    <option value="Поликлиника">Поликлиника</option>
                    <option value="МФЦ">МФЦ</option>
                    <option value="Почта">Почта</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Отправить на проверку</button>
        </form>
    </section>
{% endblock %}
